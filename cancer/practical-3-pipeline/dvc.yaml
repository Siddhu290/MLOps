# dvc.yaml
stages:
  collect:
    cmd: python src/pipeline/collect.py --output data/raw/cancer_raw.csv
    deps:
      - src/pipeline/collect.py
    outs:
      - data/raw/cancer_raw.csv

  preprocess:
    cmd: python src/pipeline/preprocess.py --input data/raw/cancer_raw.csv --output data/processed/cancer_preprocessed.csv
    deps:
      - data/raw/cancer_raw.csv
      - src/pipeline/preprocess.py
    outs:
      - data/processed/cancer_preprocessed.csv

  features:
    cmd: python src/pipeline/features.py --input data/processed/cancer_preprocessed.csv --output data/processed/cancer_features.csv
    deps:
      - data/processed/cancer_preprocessed.csv
      - src/pipeline/features.py
    outs:
      - data/processed/cancer_features.csv

  validate:
    cmd: python src/pipeline/validate.py --input data/processed/cancer_features.csv
    deps:
      - data/processed/cancer_features.csv
      - src/pipeline/validate.py
